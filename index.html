<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Chat App - Production Flow</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f4f9;
        color: #333;
      }
      .container {
        max-width: 650px;
        margin: 0 auto;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      input,
      button,
      select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #0056b3;
      }
      .hidden {
        display: none !important;
      }
      ul {
        padding-left: 20px;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 10px;
        background: #fafafa;
        border-radius: 4px;
        list-style-type: none;
      }
      li {
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .logout-btn {
        background: #dc3545;
      }
      .logout-btn:hover {
        background: #c82333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🚀 Production Ready Chat System</h2>

      <!-- STEP 1: AUTH SECTION (Signup / Login) -->
      <div id="authSection" class="card">
        <h3 id="formTitle">Login</h3>
        <input type="text" id="emailInput" placeholder="Enter Email" />
        <input
          type="password"
          id="passwordInput"
          placeholder="Enter Password"
        />
        <button id="authBtn" onclick="handleAuth()">Login</button>
        <p style="text-align: center; margin-top: 10px; font-size: 14px">
          <span id="toggleText">Don't have an account?</span>
          <a
            href="#"
            onclick="toggleMode()"
            id="toggleLink"
            style="color: #007bff; text-decoration: none"
            >Sign Up</a
          >
        </p>
      </div>

      <!-- STEP 2: DASHBOARD SECTION (Profile, Create Conversation, Conversations List) -->
      <div id="dashboardSection" class="card hidden">
        <h3>User Dashboard</h3>
        <div
          id="userInfo"
          style="
            margin-bottom: 15px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
          "
        >
          Loading profile...
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>

        <hr style="margin: 20px 0" />

        <!-- Create Conversation Box -->
        <h4>Create New Conversation</h4>
        <input
          type="text"
          id="recipientIdInput"
          placeholder="Enter Recipient User ID"
        />
        <button onclick="createConversation()">Create Conversation</button>

        <hr style="margin: 20px 0" />

        <!-- My Conversations List -->
        <h4>My Conversations</h4>
        <button onclick="fetchConversations()">Refresh Conversations</button>
        <ul id="conversationsList">
          <li>Click refresh to load conversations...</li>
        </ul>
      </div>

      <!-- STEP 3: CHAT ROOM SECTION -->
      <div id="chatSection" class="card hidden">
        <button
          onclick="backToDashboard()"
          style="background: #6c757d; width: auto; padding: 6px 12px"
        >
          ← Back to Dashboard
        </button>
        <h3 id="activeChatTitle">Chat Room</h3>

        <div style="margin-top: 15px">
          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
          />
          <button onclick="sendMessage()">Send Message</button>
        </div>

        <h4>Live Messages:</h4>
        <ul id="messagesList"></ul>
      </div>
    </div>

    <!-- Socket.io CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      const BASE_URL = "http://localhost:4000";
      let isSignupMode = false;
      let currentConversationId = null;

      window.onload = () => {
        const token = localStorage.getItem("token");
        if (token) {
          fetchProfile(token);
        }
      };

      function toggleMode() {
        isSignupMode = !isSignupMode;
        document.getElementById("formTitle").innerText = isSignupMode
          ? "Sign Up"
          : "Login";
        document.getElementById("authBtn").innerText = isSignupMode
          ? "Register & Signup"
          : "Login";
        document.getElementById("toggleText").innerText = isSignupMode
          ? "Already have an account?"
          : "Don't have an account?";
        document.getElementById("toggleLink").innerText = isSignupMode
          ? "Login"
          : "Sign Up";
      }

      async function handleAuth() {
        const email = document.getElementById("emailInput").value;
        const password = document.getElementById("passwordInput").value;

        if (!email || !password) {
          alert("Please enter email and password!");
          return;
        }

        const endpoint = isSignupMode
          ? "/api/users/signup"
          : "/api/users/login";

        try {
          const response = await fetch(`${BASE_URL}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            const token = data.token || data.accessToken;
            if (token) {
              localStorage.setItem("token", token);
              fetchProfile(token);
            } else {
              alert("Token missing in response!");
            }
          } else {
            alert("Failed: " + (data.error || "Invalid credentials"));
          }
        } catch (err) {
          console.error("Auth error:", err);
          alert("Server error during auth!");
        }
      }

      async function fetchProfile(token) {
        try {
          const response = await fetch(`${BASE_URL}/api/users/profile`, {
            method: "GET",
            headers: { Authorization: `Bearer ${token}` },
          });

          const data = await response.json();
          if (response.ok) {
            document.getElementById("authSection").classList.add("hidden");
            document
              .getElementById("dashboardSection")
              .classList.remove("hidden");

            document.getElementById("userInfo").innerHTML = `
            <b>ID:</b> ${data.user.id} <br>
            <b>Name:</b> ${data.user.name || "N/A"} <br>
            <b>Email:</b> ${data.user.email}
          `;
            fetchConversations();
          } else {
            logout();
          }
        } catch (err) {
          console.error("Profile error:", err);
        }
      }

      async function createConversation() {
        const recipientId = document.getElementById("recipientIdInput").value;
        const token = localStorage.getItem("token");

        if (!recipientId) {
          alert("Please enter recipient ID!");
          return;
        }

        try {
          const response = await fetch(
            `${BASE_URL}/api/chat/create-converstation`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ recipientId }),
            },
          );

          const data = await response.json();
          if (response.ok) {
            alert("Conversation created successfully!");
            document.getElementById("recipientIdInput").value = "";
            fetchConversations();
          } else {
            alert("Error: " + (data.error || "Failed to create"));
          }
        } catch (err) {
          console.error("Create conversation error:", err);
        }
      }
      async function fetchConversations() {
        const token = localStorage.getItem("token");
        try {
          const response = await fetch(
            `${BASE_URL}/api/chat/get-conversations`,
            {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
            },
          );

          const data = await response.json();
          const ul = document.getElementById("conversationsList");
          ul.innerHTML = "";

          if (response.ok && data.conversations) {
            if (data.conversations.length === 0) {
              ul.innerHTML =
                "<li>No conversations found. Create one above!</li>";
              return;
            }

            data.conversations.forEach((conv) => {
              const li = document.createElement("li");
              li.style.cursor = "pointer";
              li.style.padding = "8px";
              li.style.margin = "4px 0";
              li.style.background = "#fff";
              li.style.border = "1px solid #ccc";
              li.style.borderRadius = "4px";

              li.innerHTML = `<b>Conversation ID:</b> ${conv.id}`;
              li.onclick = () => openChatRoom(conv.id);
              ul.appendChild(li);
            });
          } else {
            ul.innerHTML = "<li>Failed to load conversations</li>";
          }
        } catch (err) {
          console.error("Fetch conversations error:", err);
        }
      }

      const socket = io(BASE_URL);

      socket.on("connect", () => {
        console.log("Socket connected:", socket.id);
      });

      function openChatRoom(conversationId) {
        currentConversationId = conversationId;
        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("chatSection").classList.remove("hidden");
        document.getElementById("activeChatTitle").innerText =
          `Chat Room: ${conversationId}`;
        document.getElementById("messagesList").innerHTML = "";

        socket.emit("join_room", conversationId);
      }

      function backToDashboard() {
        document.getElementById("chatSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        currentConversationId = null;
      }

      async function sendMessage() {
        const text = document.getElementById("messageInput").value;
        const token = localStorage.getItem("token");

        if (!text || !currentConversationId) {
          alert("Type a message first!");
          return;
        }

        try {
          const response = await fetch(`${BASE_URL}/api/chat/send-message`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              conversationId: currentConversationId,
              text: text,
            }),
          });

          const result = await response.json();
          if (response.ok) {
            document.getElementById("messageInput").value = "";
          } else {
            alert("Error: " + (result.error || "Failed to send"));
          }
        } catch (err) {
          console.error("Send error:", err);
        }
      }

      socket.on("receive_message", (data) => {
        const ul = document.getElementById("messagesList");
        const li = document.createElement("li");
        li.textContent = `Message: ${data.message}`;
        ul.appendChild(li);
      });

      function logout() {
        localStorage.removeItem("token");
        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("chatSection").classList.add("hidden");
        document.getElementById("authSection").classList.remove("hidden");
      }
    </script>
  </body>
</html>
