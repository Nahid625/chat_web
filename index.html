<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Ocean Glassmorphism Chat</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Socket.io Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      :root {
        --bg-deep: #031321;
        --ocean-glow: #0ea5e9;
        --cyan-accent: #67e8f9;
        --glass-bg: rgba(9, 25, 40, 0.45);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at top, #0b3d5f, #051825, #01070f);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        position: relative;
      }

      /* Mouse Glow Follower */
      #mouse-glow {
        position: fixed;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(103, 232, 249, 0.12) 0%,
          transparent 70%
        );
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition:
          width 0.3s,
          height 0.3s;
        z-index: 1;
      }

      /* Ambient Background Orbs */
      .ambient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(250px);
        pointer-events: none;
        z-index: 0;
      }
      .orb-1 {
        width: 400px;
        height: 400px;
        background: rgba(103, 232, 249, 0.15);
        top: -100px;
        left: -100px;
      }
      .orb-2 {
        width: 500px;
        height: 500px;
        background: rgba(14, 165, 233, 0.12);
        bottom: -150px;
        right: -150px;
      }

      /* Floating Bubbles Layer */
      .bubbles-container {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .bubble {
        position: absolute;
        bottom: -100px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        animation: riseBubble linear infinite;
      }
      @keyframes riseBubble {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0;
        }
        30% {
          opacity: 0.6;
        }
        70% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(-120vh) scale(1.4);
          opacity: 0;
        }
      }

      /* Main Container & Card Ambient Float */
      .app-container {
        width: 100%;
        max-width: 620px;
        padding: 20px;
        z-index: 2;
        animation: cardFloat 8s ease-in-out infinite;
      }
      @keyframes cardFloat {
        0%,
        100% {
          transform: translateY(-4px);
        }
        50% {
          transform: translateY(4px);
        }
      }

      /* Glass Cards */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(35px);
        -webkit-backdrop-filter: blur(35px);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        padding: 35px;
        transform: translateZ(30px) rotateX(1deg);
        transition:
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.4s ease;
      }
      .glass-card:hover {
        transform: translateY(-6px) scale(1.01) translateZ(35px);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      }

      .hidden {
        display: none !important;
      }

      /* Typography */
      h2,
      h4,
      h5,
      h6 {
        color: var(--text-main);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .text-muted {
        color: var(--text-muted) !important;
      }

      /* Floating Glass Inputs */
      .glass-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 14px 18px;
        color: var(--text-main);
        font-size: 0.95rem;
        outline: none;
        transition: all 0.3s ease;
      }
      .glass-input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }
      .glass-input:focus {
        border-color: var(--cyan-accent);
        box-shadow: 0 0 25px rgba(50, 180, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
      }

      /* Ocean Buttons */
      .ocean-btn {
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        border: none;
        color: #ffffff;
        font-weight: 600;
        border-radius: 16px;
        padding: 14px 24px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
        position: relative;
        overflow: hidden;
      }
      .ocean-btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: 0.5s;
      }
      .ocean-btn:hover::after {
        left: 100%;
      }
      .ocean-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 15px 35px rgba(6, 182, 212, 0.4);
      }
      .ocean-btn:active {
        transform: scale(0.97);
      }

      .btn-outline-ocean {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--cyan-accent);
        border-radius: 12px;
        padding: 8px 16px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-outline-ocean:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      /* Conversation List items */
      .conv-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .conv-item:hover {
        transform: translateX(6px);
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(103, 232, 249, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .conv-item.active {
        background: rgba(14, 165, 233, 0.12);
        border-color: var(--cyan-accent);
      }
      .conv-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 4px;
        background: var(--cyan-accent);
        box-shadow: 0 0 10px var(--cyan-accent);
      }

      /* Chat Area & Custom Ocean Scrollbar */
      #liveMessages {
        height: 420px;
        overflow-y: auto;
        background: rgba(3, 19, 33, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 20px;
        padding: 20px;
        scroll-behavior: smooth;
      }
      #liveMessages::-webkit-scrollbar {
        width: 4px;
      }
      #liveMessages::-webkit-scrollbar-track {
        background: transparent;
      }
      #liveMessages::-webkit-scrollbar-thumb {
        background: var(--ocean-glow);
        border-radius: 10px;
      }

      /* Message Bubbles & Pop Animation */
      .message-row {
        display: flex;
        width: 100%;
        margin-bottom: 14px;
      }
      .message-row.sent {
        justify-content: flex-end;
      }
      .message-row.received {
        justify-content: flex-start;
      }

      .message-bubble {
        max-width: 72%;
        padding: 12px 18px;
        font-size: 0.95rem;
        line-height: 1.4;
        word-break: break-word;
        position: relative;
        animation: bubblePop 350ms cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      @keyframes bubblePop {
        0% {
          transform: scale(0.4) translateY(25px);
          opacity: 0;
        }
        40% {
          transform: scale(1.08) translateY(-4px);
          opacity: 1;
        }
        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }

      .message-bubble::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 8px;
        right: 8px;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        filter: blur(4px);
        opacity: 0.6;
        pointer-events: none;
      }

      .sent .message-bubble {
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        color: #ffffff;
        border-radius: 26px 26px 6px 26px;
      }

      .received .message-bubble {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-main);
        border-radius: 26px 26px 26px 6px;
      }

      /* Skeleton Shimmer Loading */
      .skeleton-bubble {
        height: 40px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 18px;
        margin-bottom: 12px;
        position: relative;
        overflow: hidden;
      }
      .skeleton-bubble::after {
        content: "";
        position: absolute;
        top: 0;
        left: -150%;
        width: 150%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.06),
          transparent
        );
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .flex-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mb-4 {
        margin-bottom: 1.5rem;
      }
      .mt-3 {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <!-- Mouse Glow -->
    <div id="mouse-glow"></div>

    <!-- Ambient Background Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Floating Bubbles Layer -->
    <div class="bubbles-container" id="bubblesContainer"></div>

    <div class="app-container">
      <h2
        style="
          text-align: center;
          margin-bottom: 25px;
          font-weight: 700;
          text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        "
      >
        🌊 Deep Ocean Messenger
      </h2>

      <!-- LOGIN / REGISTER SECTION -->
      <div id="loginSection" class="glass-card">
        <h4 id="authFormTitle" class="mb-4">Welcome Back</h4>
        <form
          onsubmit="
            event.preventDefault();
            handleAuth();
          "
        >
          <!-- Name Field (Only shown during Sign Up) -->
          <div
            id="nameFieldContainer"
            style="margin-bottom: 20px; display: none"
          >
            <label
              class="text-muted"
              style="
                font-size: 0.85rem;
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
              "
              >Your Name</label
            >
            <input
              type="text"
              id="nameInput"
              class="glass-input"
              placeholder="Nahid"
              autocomplete="off"
            />
          </div>

          <div style="margin-bottom: 20px">
            <label
              class="text-muted"
              style="
                font-size: 0.85rem;
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
              "
              >Email Address</label
            >
            <input
              type="email"
              id="emailInput"
              class="glass-input"
              placeholder="name@example.com"
              autocomplete="off"
              required
            />
          </div>
          <div style="margin-bottom: 25px">
            <label
              class="text-muted"
              style="
                font-size: 0.85rem;
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
              "
              >Password</label
            >
            <input
              type="password"
              id="passwordInput"
              class="glass-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>

          <button
            type="submit"
            id="authSubmitBtn"
            class="ocean-btn"
            style="width: 100%; margin-bottom: 15px"
          >
            Sign In
          </button>

          <div style="text-align: center">
            <a
              href="#"
              id="authToggleLink"
              onclick="
                toggleAuthMode();
                return false;
              "
              style="
                color: var(--cyan-accent);
                font-size: 0.85rem;
                text-decoration: none;
              "
              >Don't have an account? Sign Up</a
            >
          </div>
        </form>
      </div>

      <!-- DASHBOARD SECTION -->
      <div id="dashboardSection" class="glass-card hidden">
        <div class="flex-between mb-4">
          <h5>Conversations</h5>
          <button class="btn-outline-ocean" onclick="logout()">Logout</button>
        </div>

        <label
          class="text-muted"
          style="
            font-size: 0.82rem;
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
          "
          >Select a User to Start Chat</label
        >
        <!-- Dynamic User List Container (Replaced text input) -->
        <div
          id="allUsersList"
          style="max-height: 180px; overflow-y: auto; margin-bottom: 25px"
        >
          <!-- Users populate here -->
        </div>

        <div class="flex-between" style="margin-bottom: 12px">
          <h6
            class="text-muted"
            style="
              font-size: 0.85rem;
              text-transform: uppercase;
              letter-spacing: 0.05em;
            "
          >
            Active Chats
          </h6>
          <button
            class="btn-outline-ocean"
            style="padding: 4px 10px; font-size: 0.75rem"
            onclick="
              loadConversations();
              loadAllUsers();
            "
          >
            Refresh
          </button>
        </div>
        <div id="conversationList" style="max-height: 200px; overflow-y: auto">
          <!-- Conversations populate here -->
        </div>
      </div>

      <!-- CHAT ROOM SECTION -->
      <div id="chatSection" class="glass-card hidden">
        <div class="flex-between mb-4">
          <button class="btn-outline-ocean" onclick="backToDashboard()">
            &larr; Back
          </button>
          <span
            id="chatTitle"
            style="
              background: rgba(14, 165, 233, 0.15);
              color: var(--cyan-accent);
              padding: 6px 14px;
              border-radius: 20px;
              font-size: 0.85rem;
              border: 1px solid rgba(103, 232, 249, 0.2);
            "
            >Room</span
          >
        </div>

        <div id="liveMessages" class="mb-4">
          <!-- Messages populate here -->
        </div>

        <div style="display: flex; gap: 10px">
          <input
            type="text"
            id="messageInput"
            class="glass-input"
            placeholder="Type a message..."
            autocomplete="off"
            onkeydown="if (event.key === 'Enter') sendMessage();"
          />
          <button
            class="ocean-btn"
            style="padding: 12px 24px"
            onclick="sendMessage()"
          >
            Send
          </button>
        </div>
      </div>
    </div>

    <script>
      // Backend configuration URLs
      const API_URL = "http://localhost:4000/api";
      const SOCKET_URL = "http://localhost:4000";

      const socket = io(SOCKET_URL);
      let currentConversationId = null;
      let currentUserId = null;
      let isRegisterMode = false;

      // Auto-login check on page load
      window.addEventListener("DOMContentLoaded", () => {
        if (!checkAuth()) return;

        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");

        loadConversations();
        loadAllUsers();
      });

      // Toggle between Sign In and Sign Up views
      function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        const title = document.getElementById("authFormTitle");
        const btn = document.getElementById("authSubmitBtn");
        const link = document.getElementById("authToggleLink");
        const nameField = document.getElementById("nameFieldContainer");

        if (isRegisterMode) {
          title.innerText = "Create Account";
          btn.innerText = "Sign Up";
          link.innerText = "Already have an account? Sign In";
          nameField.style.display = "block";
          document.getElementById("nameInput").required = true;
        } else {
          title.innerText = "Welcome Back";
          btn.innerText = "Sign In";
          link.innerText = "Don't have an account? Sign Up";
          nameField.style.display = "none";
          document.getElementById("nameInput").required = false;
        }
      }

      // Generate Floating Background Bubbles dynamically
      const bubblesContainer = document.getElementById("bubblesContainer");
      for (let i = 0; i < 18; i++) {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const size = Math.random() * 16 + 6 + "px";
        bubble.style.width = size;
        bubble.style.height = size;
        bubble.style.left = Math.random() * 100 + "%";
        bubble.style.animationDuration = Math.random() * 8 + 6 + "s";
        bubble.style.animationDelay = Math.random() * 5 + "s";
        bubblesContainer.appendChild(bubble);
      }

      // Mouse Glow Follower Tracker
      const mouseGlow = document.getElementById("mouse-glow");
      window.addEventListener("mousemove", (e) => {
        mouseGlow.style.left = e.clientX + "px";
        mouseGlow.style.top = e.clientY + "px";
      });

      function getUserIdFromToken(token) {
        try {
          const base64Url = token.split(".")[1];
          const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
          const jsonPayload = decodeURIComponent(
            atob(base64)
              .split("")
              .map((c) => "%" + ("0" + c.charCodeAt(0).toString(16)).slice(-2))
              .join(""),
          );
          return JSON.parse(jsonPayload).id || JSON.parse(jsonPayload).userId;
        } catch (e) {
          return null;
        }
      }

      socket.on("connect", () => {
        console.log("Connected to Deep Ocean Socket Server:", socket.id);
      });

      socket.on("receive_message", (data) => {
        appendMessage(data.message, data.senderId);
      });

      async function handleAuth() {
        const email = document.getElementById("emailInput").value;
        const password = document.getElementById("passwordInput").value;

        let endpoint = `${API_URL}/users/login`;
        let payload = { email, password };

        if (isRegisterMode) {
          endpoint = `${API_URL}/users/signup`;
          payload.name = document.getElementById("nameInput").value;
        }

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (res.ok && (data.token || data.status === "okk")) {
            if (isRegisterMode) {
              alert("Account created successfully! Please sign in.");
              toggleAuthMode();
              return;
            }

            const token = data.token;
            localStorage.setItem("token", token);
            currentUserId = getUserIdFromToken(token);

            document.getElementById("loginSection").classList.add("hidden");
            document
              .getElementById("dashboardSection")
              .classList.remove("hidden");
            loadConversations();
            loadAllUsers();
          } else {
            alert(data.error || data.message || "Authentication failed!");
          }
        } catch (err) {
          console.error("Auth Error:", err);
          alert("Server error during authentication.");
        }
      }

      function logout() {
        localStorage.removeItem("token");
        currentUserId = null;
        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("chatSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("emailInput").value = "";
        document.getElementById("passwordInput").value = "";
        if (document.getElementById("nameInput"))
          document.getElementById("nameInput").value = "";
      }

      // Fetch all users to display in list instead of typing ID
      async function loadAllUsers() {
        const token = localStorage.getItem("token");
        const usersListDiv = document.getElementById("allUsersList");

        usersListDiv.innerHTML = `
            <div class="skeleton-bubble" style="width: 100%;"></div>
            <div class="skeleton-bubble" style="width: 80%;"></div>
        `;

        try {
          const res = await fetch(`${API_URL}/users/all-users`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.status == 401) {
            alert("Your session has expired. Please login again.");
            logout();
            return;
          }
          const data = await res.json();

          usersListDiv.innerHTML = "";
          const usersList =
            data.users || data.data || (Array.isArray(data) ? data : []);

          if (usersList.length > 0) {
            usersList.forEach((user) => {
              const userCard = document.createElement("div");
              userCard.className = "conv-item";
              userCard.style.display = "flex";
              userCard.style.justifyContent = "space-between";
              userCard.style.alignItems = "center";

              userCard.innerHTML = `
                <div>
                  <div style="font-weight: 600; color: var(--text-main);">${user.name || "User"}</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">${user.email}</div>
                </div>
                <button class="ocean-btn" style="padding: 6px 14px; font-size: 0.75rem;" onclick="startChat('${user.id || user._id}')">Chat</button>
              `;
              usersListDiv.appendChild(userCard);
            });
          } else {
            usersListDiv.innerHTML =
              "<p class='text-muted' style='text-align: center; font-size: 0.85rem; padding: 15px;'>No other users found.</p>";
          }
        } catch (err) {
          console.error("Error loading users:", err);
          usersListDiv.innerHTML =
            "<p style='color: #ef4444; text-align: center; font-size: 0.85rem;'>Failed to load users list.</p>";
        }
      }

      // Automatically triggered when clicking "Chat" on a user card
      async function startChat(recipientId) {
        const token = localStorage.getItem("token");
        if (res.status == 401) {
          alert("Your session has expired. Please login again.");
          logout();
          return;
        }
        if (!recipientId) return;

        try {
          const res = await fetch(`${API_URL}/chat/create-converstation`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ recipientId }),
          });

          if (res.ok) {
            loadConversations();
          } else {
            const errorData = await res.json();
            alert(
              errorData.error ||
                errorData.message ||
                "Failed to create conversation",
            );
          }
        } catch (err) {
          console.error("Create Conversation Error:", err);
        }
      }

      async function loadConversations() {
        const token = localStorage.getItem("token");
        if (!currentUserId && token) currentUserId = getUserIdFromToken(token);

        const listDiv = document.getElementById("conversationList");
        listDiv.innerHTML = `
      <div class="skeleton-bubble" style="width: 100%;"></div>
      <div class="skeleton-bubble" style="width: 80%;"></div>
  `;

        try {
          const res = await fetch(`${API_URL}/chat/get-conversations`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.status == 401) {
            alert("Your session has expired. Please login again.");
            logout();
            return;
          }
          const data = await res.json();

          listDiv.innerHTML = "";
          if (data.conversations && data.conversations.length > 0) {
            data.conversations.forEach((conv) => {
              // --- NEW LOGIC: Find the other user's name ---
              let otherName = "Unknown User";
              if (conv.users && conv.users.length > 0) {
                const otherParticipant = conv.users.find(
                  (u) =>
                    String(u.user?.id || u.userId) !== String(currentUserId),
                );
                if (otherParticipant) {
                  otherName =
                    otherParticipant.user?.name ||
                    otherParticipant.user?.email ||
                    "User";
                }
              }
              // ---------------------------------------------

              const item = document.createElement("div");
              item.className = `conv-item ${conv.id === currentConversationId ? "active" : ""}`;

              // Replaced conv.id with otherName
              item.innerHTML = `<span style="font-size: 0.88rem; color: var(--text-main); font-weight: 500;">${otherName}</span> <span style="font-size: 0.75rem; color: var(--cyan-accent);">Open &rarr;</span>`;

              item.onclick = () => openChatRoom(conv.id);
              listDiv.appendChild(item);
            });
          } else {
            listDiv.innerHTML =
              "<p class='text-muted' style='text-align: center; font-size: 0.85rem; padding: 20px;'>No active conversations.</p>";
          }
        } catch (err) {
          console.error("Load Conversations Error:", err);
          listDiv.innerHTML =
            "<p style='color: #ef4444; text-align: center; font-size: 0.85rem;'>Failed to load conversations.</p>";
        }
      }
      async function openChatRoom(conversationId) {
        currentConversationId = conversationId;

        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("chatSection").classList.remove("hidden");
        document.getElementById("chatTitle").innerText =
          `Room: ${conversationId.substring(0, 10)}...`;

        const messageContainer = document.getElementById("liveMessages");
        messageContainer.innerHTML = `
            <div class="skeleton-bubble" style="width: 60%;"></div>
            <div class="skeleton-bubble" style="width: 45%; margin-left: auto;"></div>
            <div class="skeleton-bubble" style="width: 75%;"></div>
        `;

        socket.emit("join_room", conversationId);

        const token = localStorage.getItem("token");
        try {
          const res = await fetch(
            `${API_URL}/chat/messages/${conversationId}`,
            {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
            },
          );
          if (res.status == 401) {
            alert("Your session has expired. Please login again.");
            logout();
            return;
          }
          const data = await res.json();
          messageContainer.innerHTML = "";

          if (res.ok && data.data && data.data.length > 0) {
            data.data.forEach((msg) => {
              appendMessage(msg.message, msg.senderId);
            });
            scrollToBottom();
          } else {
            messageContainer.innerHTML =
              "<p id='noMsgText' class='text-muted' style='text-align: center; font-size: 0.85rem; margin-top: 150px;'>No messages yet. Dive in and say hello!</p>";
          }
        } catch (err) {
          console.error("Fetch History Error:", err);
          messageContainer.innerHTML =
            "<p style='color: #ef4444; text-align: center; font-size: 0.85rem;'>Failed to load message history.</p>";
        }
      }

      function backToDashboard() {
        currentConversationId = null;
        document.getElementById("chatSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        document.getElementById("liveMessages").innerHTML = "";
        loadConversations();
        loadAllUsers();
      }

      async function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        const token = localStorage.getItem("token");

        if (!text || !currentConversationId) return;

        input.value = "";

        try {
          await fetch(`${API_URL}/chat/send-message`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              conversationId: currentConversationId,
              text: text,
            }),
          });
        } catch (err) {
          console.error("Send Message Error:", err);
        }
      }

      function appendMessage(text, senderId) {
        const messageContainer = document.getElementById("liveMessages");

        const noMsgText = document.getElementById("noMsgText");
        if (noMsgText) noMsgText.remove();

        const isMe = senderId === currentUserId;

        const rowDiv = document.createElement("div");
        rowDiv.className = `message-row ${isMe ? "sent" : "received"}`;

        const bubbleDiv = document.createElement("div");
        bubbleDiv.className = "message-bubble";
        bubbleDiv.innerText = text;

        rowDiv.appendChild(bubbleDiv);
        messageContainer.appendChild(rowDiv);
        scrollToBottom();
      }

      function scrollToBottom() {
        const messageContainer = document.getElementById("liveMessages");
        messageContainer.scrollTop = messageContainer.scrollHeight;
      }
    </script>
  </body>
</html>
