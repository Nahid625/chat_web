<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Tester</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1e1e1e;
        color: #fff;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      .card {
        background: #2d2d2d;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #444;
        border-radius: 4px;
        background: #3d3d3d;
        color: #fff;
        box-sizing: border-box;
      }
      button {
        background: #4caf50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
      }
      button:hover {
        background: #45a049;
      }
      .btn-blue {
        background: #2196f3;
        margin-top: 10px;
      }
      .btn-blue:hover {
        background: #1976d2;
      }
      #messageBox {
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 4px;
        display: none;
      }
      .success {
        background: #4caf50;
        color: white;
      }
      .error {
        background: #f44336;
        color: white;
      }
      pre {
        background: #111;
        padding: 10px;
        border-radius: 4px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 style="text-align: center">API Tester</h2>

      <!-- Message Box for Alerts -->
      <div id="messageBox"></div>

      <!-- SIGNUP FORM -->
      <div class="card">
        <h3>Sign Up</h3>
        <form id="signupForm">
          <input type="text" id="signupName" placeholder="Name (Optional)" />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input
            type="password"
            id="signupPassword"
            placeholder="Password (Min 8 chars)"
            required
            minlength="8"
          />
          <button type="submit">Create Account</button>
        </form>
      </div>

      <!-- LOGIN FORM -->
      <div class="card">
        <h3>Log In</h3>
        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="submit">Log In</button>
        </form>
      </div>

      <!-- PROFILE TESTER -->
      <div class="card">
        <h3>Test Protected Route (Get Profile)</h3>
        <p>You must be logged in to test this.</p>
        <button id="profileBtn" class="btn-blue">Get My Profile</button>
        <div id="profileResult" style="margin-top: 15px; display: none">
          <h4>Profile Data:</h4>
          <pre id="profileData"></pre>
        </div>
      </div>
    </div>

    <script>
      // --- CONFIGURATION ---
      // Change this if your Express routes have a prefix like '/api/users'
      const API_BASE_URL = "http://localhost:4000";

      // --- UI HELPER ---
      function showMessage(msg, isError = false) {
        const msgBox = document.getElementById("messageBox");
        msgBox.textContent = msg;
        msgBox.className = isError ? "error" : "success";
        msgBox.style.display = "block";
        setTimeout(() => (msgBox.style.display = "none"), 5000);
      }

      // --- SIGNUP LOGIC ---
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("signupName").value;
          const email = document.getElementById("signupEmail").value;
          const password = document.getElementById("signupPassword").value;

          try {
            const response = await fetch(`${API_BASE_URL}/api/users/signup`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json();

            if (response.ok) {
              showMessage("Signup successful! You can now log in.");
              document.getElementById("signupForm").reset();
            } else {
              showMessage(data.error || "Signup failed", true);
            }
          } catch (err) {
            showMessage("Network error. Is your server running?", true);
          }
        });

      // --- LOGIN LOGIC ---
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;

          try {
            const response = await fetch(`${API_BASE_URL}/api/users/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (response.ok) {
              // Save the JWT token to local storage so we can use it for protected routes
              localStorage.setItem("token", data.token);
              showMessage(
                `Welcome back, ${data.user.name || "User"}! Token saved.`,
              );
              document.getElementById("loginForm").reset();
            } else {
              showMessage(data.error || "Login failed", true);
            }
          } catch (err) {
            showMessage("Network error. Is your server running?", true);
          }
        });

      // --- GET PROFILE LOGIC (PROTECTED) ---
      document
        .getElementById("profileBtn")
        .addEventListener("click", async () => {
          const token = localStorage.getItem("token");

          if (!token) {
            showMessage("No token found. Please log in first!", true);
            return;
          }

          try {
            const response = await fetch(`${API_BASE_URL}/api/users/profile`, {
              method: "GET",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            });

            const data = await response.json();
            const profileResult = document.getElementById("profileResult");
            const profileData = document.getElementById("profileData");

            if (response.ok) {
              profileData.textContent = JSON.stringify(data.user, null, 2);
              profileResult.style.display = "block";
              showMessage("Profile loaded successfully!");
            } else {
              showMessage(
                data.error || "Failed to load profile. Token might be expired.",
                true,
              );
              profileResult.style.display = "none";
            }
          } catch (err) {
            showMessage("Network error. Is your server running?", true);
          }
        });
    </script>
  </body>
</html>
