<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Socket.IO Chat</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(circle at top, #1b1b55, #050510);
        color: white;
      }

      /* 3D floating objects */

      .circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(1px);
        animation: float 8s infinite alternate;
      }

      .c1 {
        width: 250px;
        height: 250px;
        background: #00ffff55;
        top: 10%;
        left: 10%;
      }

      .c2 {
        width: 350px;
        height: 350px;
        background: #ff00ff55;
        bottom: 5%;
        right: 10%;
      }

      @keyframes float {
        from {
          transform: translateY(0px) rotate(0deg);
        }
        to {
          transform: translateY(-60px) rotate(180deg);
        }
      }

      /* main container */

      .container {
        width: 900px;
        height: 90vh;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }

      /* Glass cards */

      .card {
        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(20px);

        border-radius: 25px;

        padding: 25px;

        box-shadow:
          0 0 50px #0008,
          inset 0 0 30px #ffffff15;

        border: 1px solid #ffffff22;

        animation: card 1s ease;
      }

      @keyframes card {
        from {
          transform: translateY(100px) rotateX(30deg);

          opacity: 0;
        }

        to {
          transform: none;
          opacity: 1;
        }
      }

      h2 {
        text-align: center;

        background: linear-gradient(90deg, #00ffff, #ff00ff);

        -webkit-background-clip: text;

        color: transparent;
      }

      /* Inputs */

      input {
        width: 100%;

        padding: 15px;

        margin: 8px 0;

        border: none;

        outline: none;

        border-radius: 15px;

        background: #ffffff15;

        color: white;

        font-size: 16px;
      }

      button {
        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 15px;

        cursor: pointer;

        font-size: 16px;

        font-weight: bold;

        background: linear-gradient(45deg, #00ffff, #ff00ff);

        color: black;

        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.05) translateY(-5px);

        box-shadow: 0 0 30px #00ffff;
      }

      /* messages */

      .messages {
        height: 250px;

        overflow: auto;

        margin-top: 15px;

        padding: 15px;

        border-radius: 20px;

        background: #0005;
      }

      .msg {
        padding: 10px;

        margin: 8px;

        border-radius: 15px;

        background: linear-gradient(45deg, #ffffff22, #ffffff08);

        animation: pop 0.3s;
      }

      @keyframes pop {
        from {
          transform: scale(0.5);

          opacity: 0;
        }

        to {
          transform: scale(1);

          opacity: 1;
        }
      }

      .status {
        text-align: center;

        font-size: 18px;

        color: #00ffff;
      }
    </style>
  </head>

  <body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="container">
      <!-- ROOM CHAT -->

      <div class="card">
        <h2>🌌 Room Chat</h2>

        <input id="room" placeholder="Enter Room ID" />

        <button onclick="joinRoom()">Join Room</button>

        <input id="roomMsg" placeholder="Message" />

        <button onclick="sendRoom()">Send</button>

        <div class="status" id="users">Users: 0</div>

        <div class="messages" id="roomMessages"></div>
      </div>

      <!-- DIRECT CHAT -->

      <div class="card">
        <h2>⚡ Direct Chat</h2>

        <input id="directMsg" placeholder="Global Message" />

        <button onclick="sendDirect()">Broadcast</button>

        <div class="messages" id="directMessages"></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      // ROOM NAMESPACE

      const roomSocket = io("/chat");

      let currentRoom = "";

      function joinRoom() {
        currentRoom = document.getElementById("room").value;

        if (!currentRoom) return alert("Enter room");

        roomSocket.emit("join_room", currentRoom);
      }

      function sendRoom() {
        let msg = document.getElementById("roomMsg").value;

        roomSocket.emit("message", msg, currentRoom);

        addRoom("You : " + msg);
      }

      roomSocket.on("message", (msg) => {
        addRoom(msg);
      });

      roomSocket.on("sleep", (data) => {
        document.getElementById("users").innerHTML = data;
      });

      function addRoom(text) {
        let div = document.createElement("div");

        div.className = "msg";

        div.innerHTML = text;

        document.getElementById("roomMessages").appendChild(div);
      }

      // DIRECT CHAT

      const directSocket = io("/dirrect_chat");

      function sendDirect() {
        let msg = document.getElementById("directMsg").value;

        directSocket.emit("send_message", msg);
      }

      directSocket.on("receive_message", (msg) => {
        let div = document.createElement("div");

        div.className = "msg";

        div.innerHTML = msg;

        document.getElementById("directMessages").appendChild(div);
      });
    </script>
  </body>
</html>
